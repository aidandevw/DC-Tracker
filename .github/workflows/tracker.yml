name: Roblox Spike Tracker

on:
  schedule:
    # Each run loops for ~55 min (a check every 5 min). The schedule just keeps a
    # next run queued, so GitHub's late starts don't leave gaps. Needs a PUBLIC repo
    # (unlimited minutes); this would use ~44,000 min/month on a private one.
    - cron: "7,27,47 * * * *"
  workflow_dispatch:      # lets you click "Run workflow" manually
    inputs:
      test_webhooks:
        description: "Only send a test message to every webhook"
        type: boolean
        default: false

concurrency:
  group: roblox-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Restore tracker memory
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: tracker-state-${{ github.run_id }}
          restore-keys: tracker-state-

      - name: Run one tracking cycle
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WEBHOOK_LOW: ${{ secrets.WEBHOOK_LOW }}
          WEBHOOK_MID: ${{ secrets.WEBHOOK_MID }}
          WEBHOOK_POPULAR: ${{ secrets.WEBHOOK_POPULAR }}
          TRACKER_QUIET: "1"   # hides game names in public logs
        run: |
          if [ "${{ inputs.test_webhooks }}" = "true" ]; then
            python tracker.py --test-webhook
          else
            python tracker.py --duration 55
          fi

      - name: Save tracker memory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: tracker-state-${{ github.run_id }}-${{ github.run_attempt }}
